interface:
  display_name: "MaxStat Analytics"
  short_description: "Поиск и сравнение каналов и публикаций MAX"
  default_prompt: "Use $maxstat-analytics to compare MAX channels by audience growth, views and reactions."

dependencies:
  tools:
    - type: "mcp"
      value: "maxstat"
      description: "Поиск каналов и публикаций MAX, аудитория, просмотры и реакции"
      transport: "streamable_http"
      url: "https://maxstat.ru/api/mcp"

policy:
  allow_implicit_invocation: true
