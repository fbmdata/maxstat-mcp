name: Publish to MCP Registry

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Verify the release version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          files=(
            server.json
            package.json
            gemini-extension.json
            .claude-plugin/marketplace.json
            plugins/maxstat/.codex-plugin/plugin.json
            plugins/maxstat/.claude-plugin/plugin.json
          )
          for file in "${files[@]}"; do
            manifest_version="$(jq -r '.version' "$file")"
            if [[ "$release_version" != "$manifest_version" ]]; then
              echo "Tag ${GITHUB_REF_NAME} does not match $file version ${manifest_version}."
              exit 1
            fi
          done

      - name: Test integration contracts
        run: npm test

      - name: Validate integration manifests
        run: npm run validate

      - name: Install mcp-publisher
        shell: bash
        run: |
          curl -L \
            "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher

      - name: Validate server.json
        run: ./mcp-publisher validate server.json

      - name: Authenticate with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish to the Official MCP Registry
        run: ./mcp-publisher publish server.json
