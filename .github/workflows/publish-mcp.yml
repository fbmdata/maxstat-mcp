name: Publish to MCP Registry

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

env:
  MCP_PUBLISHER_VERSION: v1.8.0
  MCP_PUBLISHER_SHA256: 1370446bbe74d562608e8005a6ccce02d146a661fbd78674e11cc70b9618d6cf

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Verify the release version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          files=(
            server.json
            package.json
            gemini-extension.json
            .claude-plugin/marketplace.json
            plugins/maxstat/.codex-plugin/plugin.json
            plugins/maxstat/.claude-plugin/plugin.json
          )
          for file in "${files[@]}"; do
            manifest_version="$(jq -r '.version' "$file")"
            if [[ "$release_version" != "$manifest_version" ]]; then
              echo "Tag ${GITHUB_REF_NAME} does not match $file version ${manifest_version}."
              exit 1
            fi
          done

      - name: Test integration contracts
        run: npm test

      - name: Validate integration manifests
        run: npm run validate

      - name: Install mcp-publisher
        shell: bash
        run: |
          archive="mcp-publisher_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/${archive}" \
            --output "${archive}"
          echo "${MCP_PUBLISHER_SHA256}  ${archive}" | sha256sum --check -
          tar xzf "${archive}" mcp-publisher

      - name: Validate server.json
        run: ./mcp-publisher validate server.json

      - name: Authenticate with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish to the Official MCP Registry
        run: ./mcp-publisher publish server.json
