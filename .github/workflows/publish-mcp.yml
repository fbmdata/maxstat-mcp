name: Publish to MCP Registry

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Verify the release version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          manifest_version="$(jq -r '.version' server.json)"
          if [[ "${GITHUB_REF_NAME}" != "v${manifest_version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match server.json version ${manifest_version}."
            exit 1
          fi

      - name: Install mcp-publisher
        shell: bash
        run: |
          curl -L \
            "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher

      - name: Validate server.json
        run: ./mcp-publisher validate server.json

      - name: Authenticate with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish to the Official MCP Registry
        run: ./mcp-publisher publish server.json
