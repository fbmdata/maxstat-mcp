name: Validate integrations

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code@2.1.220

      - name: Test integration contracts
        run: npm test

      - name: Validate integration manifests
        run: npm run validate

      - name: Validate Claude marketplace and plugin
        run: |
          claude plugin validate . --strict
          claude plugin validate ./plugins/maxstat --strict

      - name: Lint Markdown
        run: npm run lint
