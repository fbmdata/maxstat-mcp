name: Проблема подключения
description: Сообщите, если MaxStat MCP не работает в вашем клиенте
title: "[Совместимость]: "
body:
  - type: markdown
    attributes:
      value: |
        Не публикуйте API-токены, персональные данные и ответы с закрытыми данными.

  - type: dropdown
    id: client
    attributes:
      label: MCP-клиент
      options:
        - Codex
        - Claude Code
        - Visual Studio Code
        - GitHub Copilot CLI
        - Gemini CLI
        - Cursor
        - Cline
        - Windsurf
        - JetBrains AI Assistant
        - Claude Desktop
        - Другой
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Версия клиента
      placeholder: Например, 1.2.4
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Как повторить ошибку
      description: Укажите инструкцию или настройки, с которыми возникла ошибка.
      placeholder: |
        1. Добавил конфигурацию…
        2. Перезапустил клиент…
        3. Получил ошибку…
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Что должно было произойти
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Что произошло
      description: Удалите токены и персональные данные из логов и скриншотов.
    validations:
      required: true

  - type: checkboxes
    id: safety
    attributes:
      label: Безопасность
      options:
        - label: В сообщении нет API-токенов и персональных данных.
          required: true
