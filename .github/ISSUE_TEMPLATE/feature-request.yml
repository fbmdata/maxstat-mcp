name: Предложение по улучшению
description: Предложите новую функцию или изменение MaxStat MCP
title: "[Идея]: "
body:
  - type: markdown
    attributes:
      value: |
        Предложите новую интеграцию, функцию или изменение настроек и документации.

  - type: dropdown
    id: area
    attributes:
      label: Что хотите улучшить
      options:
        - Новый MCP-клиент или платформа
        - Инструменты и данные MaxStat MCP
        - Установка и конфигурация
        - Документация и примеры
        - Другое
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Какую задачу нужно решить
      description: Опишите сценарий и то, чего сейчас не хватает.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Ваше решение
      description: Опишите, что должно измениться и как это поможет.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Ссылки и примеры
      description: Добавьте материалы, которые помогут понять задачу. Удалите личные данные.

  - type: checkboxes
    id: safety
    attributes:
      label: Безопасность
      options:
        - label: В сообщении нет API-токенов и персональных данных.
          required: true
